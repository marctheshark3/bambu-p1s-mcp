[project]
name = "bambu-p1s-mcp"
version = "0.1.0"
description = "Harness-agnostic MCP server for a Bambu Lab P1S on the local network."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Marc Mailloux" }]
keywords = ["mcp", "bambu", "p1s", "3d-print", "mqtt"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=1.9.0,<2",
  "paho-mqtt>=2.1.0",
  "python-dotenv>=1.0.0",
  "starlette>=0.38.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
bambu-p1s-mcp = "bambu_p1s_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
